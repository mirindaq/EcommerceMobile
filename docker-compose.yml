services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    env_file:
      - ./Back-End/env/prod.env
    environment:
      MYSQL_DATABASE: ecommerceWWW
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DATABASE_USER}",
          "-p${DATABASE_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-network

  backend:
    container_name: ecommerce-backend
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    env_file:
      - ./Back-End/env/prod.env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    volumes:
      - /home/ubuntu/EcommerceMobile/uploads:/app/uploads
      - /home/ubuntu/EcommerceMobile/logs:/app/logs
    networks:
      - ecommerce-network

  frontend:
    container_name: ecommerce-frontend
    build:
      context: ./Front-End
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
          "||",
          "exit",
          "1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecommerce-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecommerce-network


  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:7070
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "7070:7070"
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminecommerce
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - ecommerce-network

  loki:
    image: grafana/loki:3.0.0
    container_name: ecommerce-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yaml
    networks:
      - ecommerce-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ecommerce-promtail
    restart: unless-stopped
    volumes:
      - /home/ubuntu/EcommerceMobile/logs:/var/log/ecommerce:ro
      - ./promtail.yaml:/etc/promtail/promtail.yaml:ro
    command: -config.file=/etc/promtail/promtail.yaml
    depends_on:
      - loki
    networks:
      - ecommerce-network

  mysqld-exporter:
    image: quay.io/prometheus/mysqld-exporter:latest
    container_name: ecommerce-mysqld-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=root:springstudent@(mysql:3306)/
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-network

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: ecommerce-elasticsearch-exporter
    restart: unless-stopped
    command:
      - "--es.uri=http://elasticsearch:9200"
    ports:
      - "9114:9114"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

volumes:
  mysql_data:
    name: ecommerce-mysql-data
  elasticsearch_data:
    name: ecommerce-elasticsearch-data
  qdrant_data:
    name: ecommerce-qdrant-data
  prometheus_data:
    name: ecommerce-prometheus-data
  grafana_data:
    name: ecommerce-grafana-data
  loki_data:
    name: ecommerce-loki-data
